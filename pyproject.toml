[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuse-fl"
version = "0.1.0"
description = "Open implementation and audit harness for FUSE: fairness-aware update screening against Byzantine exploitation in q-fair federated learning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Habib Ur Rehman" }]
keywords = ["federated-learning", "byzantine-robustness", "fairness", "q-fair", "security", "audit"]
dependencies = ["torch>=2.0", "numpy>=1.24", "scipy>=1.10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/habib-analyst/fuse-fl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
